<!DOCTYPE html>
<html>
<head>
<title>Dinder 1.0</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Dinder 1.0</h1>
<a>NOTE: This is a llm in training! do not take ANYTHING it says seriously!!</a>
<div id="chatContainer">
  <div id="chatOutput"></div>
  <div id="chatInput">
    <textarea id="chatText" placeholder="Type a message..."></textarea>
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<h1> </h1>

<textarea id="trainData" rows="3" placeholder="Type training text here..."></textarea>

<button onclick="train(1)">Train</button>

<h1> </h1>

<button onclick="toggleSettings()">Settings</button>

<div id="settingsPanel">
  <h2>Settings</h2>
  <label>Toggle Learning</label>
  <input type="checkbox" id="learningToggle" checked><br>

  <label>Temperature</label>
  <input type="range" id="temperature" min="0.1" max="2.0" step="0.1" value="1.0"><span id="tempVal">1.0</span><br>

  <label>Learning Rate</label>
  <input type="range" id="learningRate" min="0.01" max="0.2" step="0.01" value="0.05"><br>

  <label>Weight Matrix</label>
  <input type="checkbox" id="weightToggle" checked><br>
  <label>Attention Heatmap</label>
  <input type="checkbox" id="attentionToggle" checked><br>


  <button onclick="resetWeights()">Reset Training</button><br>

  <button onclick="saveSession()">Save</button>
  <button onclick="loadSession()">Load</button><br>
  <h1> </h1>

</div>

<h1> </h1>

<button onclick="clearOutput()">Clear Chat</button>

<h1>

</h1>


<canvas id="weightCanvas" width="500" height="500"></canvas>
<canvas id="heatmapCanvas" width="500" height="30"></canvas>





<script src="dinder.js"></script>
</body>
</html>
